name: Terraform plan

on:
  push:
    branches:
      - main

env:
  AWS_REGION: us-east-1

jobs:
  plan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.6.0

      - name: Terraform Init
        working-directory: "eticket-app"
        run: terraform init

      - name : Terraform init
        working-directory: "stickynotes-app"
        run: terraform init

      - name: Terraform Plan
        working-directory: "eticket-app"
        run: terraform plan

      - name: Terraform Plan
        working-directory: "stickynotes-app"
        run: terraform plan